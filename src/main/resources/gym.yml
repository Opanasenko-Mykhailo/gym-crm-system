openapi: 3.0.1
info:
 title: Trainer API
 version: 1.0.0
 description: REST API for managing Gym trainees, trainers and trainings
servers:
  - url: https://localhost:8080/api/v1
    description: Local development environment

paths:
 /trainers/register:
   post:
     summary: Register a new trainer
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/TrainerRegistrationRequest'
     responses:
       '200':
         description: Trainer registered successfully
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/AuthResponse'

 /trainers/{username}:
   get:
     summary: Get trainer profile
     parameters:
       - name: username
         in: path
         required: true
         schema:
           type: string
     responses:
       '200':
         description: Trainer profile
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/TrainerProfileResponse'
   put:
     summary: Update trainer profile
     parameters:
       - name: username
         in: path
         required: true
         schema:
           type: string
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/TrainerUpdateRequest'
     responses:
       '200':
         description: Updated trainer profile
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/TrainerProfileResponse'

 /trainers/{username}/change-activation-status:
   patch:
     summary: Activate or deactivate a trainer
     parameters:
       - name: username
         in: path
         required: true
         schema:
           type: string
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/StatusUpdateRequest'
     responses:
       '200':
         description: Activation status updated

 /trainers/{username}/trainings:
   get:
     summary: Get trainer's training list
     parameters:
       - name: username
         in: path
         required: true
         schema:
           type: string
       - name: periodFrom
         in: query
         required: false
         schema:
           type: string
           format: date
       - name: periodTo
         in: query
         required: false
         schema:
           type: string
           format: date
       - name: traineeName
         in: query
         required: false
         schema:
           type: string
     responses:
       '200':
         description: List of trainings
         content:
           application/json:
             schema:
               type: array
               items:
                 $ref: '#/components/schemas/TrainingResponse'

components:
 schemas:
   TrainerRegistrationRequest:
     type: object
     required: [firstName, lastName, specializationId]
     properties:
       firstName:
         type: string
       lastName:
         type: string
       specializationId:
         type: integer
         description: ID of the training type
   AuthResponse:
     type: object
     properties:
       username:
         type: string
       password:
         type: string
   TrainerUpdateRequest:
     type: object
     required: [firstName, lastName, isActive]
     properties:
       firstName:
         type: string
       lastName:
         type: string
       isActive:
         type: boolean
   TrainerProfileResponse:
     type: object
     properties:
       username:
         type: string
       firstName:
         type: string
       lastName:
         type: string
       specialization:
         type: string
       isActive:
         type: boolean
       trainees:
         type: array
         items:
           $ref: '#/components/schemas/TraineeShortInfo'
   TraineeShortInfo:
     type: object
     properties:
       username:
         type: string
       firstName:
         type: string
       lastName:
         type: string
   StatusUpdateRequest:
     type: object
     required: [isActive]
     properties:
       isActive:
         type: boolean
   TrainingResponse:
     type: object
     properties:
       trainingName:
         type: string
       trainingDate:
         type: string
         format: date
       trainingType:
         type: string
       trainingDuration:
         type: integer
       traineeName:
         type: string