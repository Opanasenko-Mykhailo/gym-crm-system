server:
  port: 8080
storage:
  path: classpath:initial-data.csv

database:
  url: jdbc:postgresql://localhost:5432/gym_database
  username: root
  password: root
  driver-class-name: org.postgresql.Driver

hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  hbm2ddl-auto: update
  show_sql: true
  format_sql: true
