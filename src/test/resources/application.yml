app:
  api:
    base-path: /api/v1

database:
  url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password:

hibernate:
  dialect: org.hibernate.dialect.H2Dialect
  hbm2ddl-auto: none
  show_sql: true
  format_sql: true

spring:
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true